name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate 1: Build seluruh package
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

  # Gate 2+3+6: Unit test + a11y + lint + type-check (core-react)
  core-react:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm -F @qlxion-ui/core-react exec tsc --noEmit

      - name: Lint
        run: pnpm -F @qlxion-ui/core-react lint

      - name: Unit test + a11y + coverage
        run: pnpm -F @qlxion-ui/core-react test -- --coverage
        env:
          CI: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-react-coverage
          path: packages/core-react/coverage/
          retention-days: 7

  # Gate 2+3+6: Unit test + a11y + lint + type-check (core-vue)
  core-vue:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm -F @qlxion-ui/core-vue exec tsc --noEmit

      - name: Lint
        run: pnpm -F @qlxion-ui/core-vue lint

      - name: Unit test + a11y + coverage
        run: pnpm -F @qlxion-ui/core-vue test -- --coverage
        env:
          CI: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-vue-coverage
          path: packages/core-vue/coverage/
          retention-days: 7

  # Gate 6: Lint + type-check (cli)
  cli:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm -F @qlxion-ui/cli exec tsc --noEmit

      - name: Lint
        run: pnpm -F @qlxion-ui/cli lint

  # Gate 4: Visual regression
  visual-regression:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Generate fixtures
        run: pnpm -F @qlxion-ui/visual-regression generate-fixtures

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run visual regression tests
        run: pnpm -F @qlxion-ui/visual-regression test

      - name: Upload diff screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-screenshots
          path: apps/visual-regression/tests/__snapshots__/
          retention-days: 7

  # Gate 5: Cross-framework parity check
  parity-check:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Check component parity
        run: |
          echo "=== Cross-framework parity check ==="
          REACT_COMPONENTS=$(ls packages/core-react/src/ -d */ 2>/dev/null | sed 's/.$//' | sort)
          VUE_COMPONENTS=$(ls packages/core-vue/src/ -d */ 2>/dev/null | sed 's/.$//' | tr '[:upper:]' '[:lower:]' | sort)
          
          echo "React components: $(echo $REACT_COMPONENTS | wc -l)"
          echo "Vue components: $(echo $VUE_COMPONENTS | wc -l)"
          
          PARITY_OK=true
          for comp in $REACT_COMPONENTS; do
            comp_lower=$(echo "$comp" | tr '[:upper:]' '[:lower:]')
            if ! echo "$VUE_COMPONENTS" | grep -q "^${comp_lower}$"; then
              echo "WARNING: No Vue equivalent for $comp (got: $comp_lower)"
              PARITY_OK=false
            else
              echo "✓ $comp -> $comp_lower"
            fi
          done
          
          if $PARITY_OK; then
            echo "All React components have Vue equivalents."
          else
            echo "Parity check failed — see warnings above."
            exit 1
          fi

  # Gate 6: Changeset check (required for any package change)
  changeset-check:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Check for changesets
        run: |
          # Get changed packages from the PR
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '^packages/' | cut -d'/' -f2 | sort -u)

          if [ -z "$CHANGED" ]; then
            echo "No package files changed. Skipping changeset check."
            exit 0
          fi

          # Check if any changesets exist
          CHANGESETS_COUNT=$(find .changeset -name '*.md' ! -name 'config.json' | wc -l | tr -d ' ')
          if [ "$CHANGESETS_COUNT" -eq 0 ]; then
            echo "ERROR: Changes detected in packages but no changeset found."
            echo "Run \`pnpm exec changeset\` to create one."
            echo ""
            echo "Changed packages: $CHANGED"
            exit 1
          fi

          echo "✓ Found $CHANGESETS_COUNT changeset(s)."

  # Final gate status
  gate-status:
    runs-on: ubuntu-latest
    needs: [build, core-react, core-vue, cli, visual-regression, parity-check, changeset-check]
    if: always()
    steps:
      - name: Check all gates
        run: |
          echo "CI Gate Status"
          echo "==============="
          for job in build core-react core-vue cli visual-regression parity-check changeset-check; do
            status="${{ needs[$job].result }}"
            if [ "$status" = "success" ]; then
              echo "✓ $job passed"
            elif [ "$status" = "skipped" ]; then
              echo "⊘ $job skipped"
            else
              echo "✗ $job FAILED ($status)"
              exit 1
            fi
          done
          echo ""
          echo "All CI gates passed."
